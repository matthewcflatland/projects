{% load static %} 
<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <link rel="stylesheet" href="{% static 'eCommerce/styles.css' %}" />
</head>
<body>
    <!-- Greet the user using their logged-in username -->
    <h1>Welcome, {{ request.user.username }}!</h1>

    <p>You are now logged in.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <!-- This form logs the user out -->
    <form method="POST" action="{% url 'grabsomore:logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

    <!-- Link to registration page -->
    <div style="margin-top: 20px;">
        <p>Need to Shop ?
            <a href="{% url 'eCommerce:products_list' %}">
                <button>📋 View Catalog</button>
            </a>
            {% if user_group.name == "Vendors" %}
            <a href="{% url 'eCommerce:edit_store' %}">
                <button>🏪 Manage Stores</button>
            </a>
            {% endif %}
            <a href="{% url 'eCommerce:reddit_feed' %}">
                <button>📰 Reddit Feed</button>
            </a>
        </p>
    </div>
</body>
</html>
