<h2>Change Product Price</h2>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<p><strong>Product Name:</strong> {{ product.name }}</p>
<p><strong>Current Price:</strong> ${{ product.price }}</p>


<table cellpadding="10" cellspacing="0">
    <form method="POST">
        {% csrf_token %}
        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <td><label for="product_name">Product Name:</label></td>
                <td><input type="text" id="product_name" name="new_name" /></td>
            </tr>
            <tr>
                <td><label for="description">Description:</label></td>
                <td><input type="text" id="description" name="new_description"  /></td>
            </tr>
            <tr>
                <td><label for="price">Price:</label></td>
                <td><input type="number" id="price" name="new_price" step="0.01" min="0"  /></td>
            </tr>
            <tr>
                <td><label for="stock">Stock:</label></td>
                <td><input type="number" id="stock" name="new_stock" min="0"  /></td>
            </tr>
        </table>
        <br>
        <button type="submit">Edit Product</button>
    </form>

<!-- Navigation Buttons -->
<div style="margin-top: 20px;">
    <a href="{% url 'eCommerce:vendor_store' store_id=product.store.id %}">
        <button>⬅️ Back to Store</button>
    </a>
</div>
