{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Product</title>
    <link rel="stylesheet" href="{% static 'eCommerce/styles.css' %}" />
</head>
<body>
    <h1>Add Product</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

<table cellpadding="10" cellspacing="0">
    <form method="POST">
        {% csrf_token %}
        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <td><label for="product_name">Product Name:</label></td>
                <td><input type="text" id="product_name" name="product_name" required /></td>
            </tr>
            <tr>
                <td><label for="description">Description:</label></td>
                <td><input type="text" id="description" name="description" required /></td>
            </tr>
            <tr>
                <td><label for="price">Price:</label></td>
                <td><input type="number" id="price" name="price" step="0.01" min="0" required /></td>
            </tr>
            <tr>
                <td><label for="stock">Stock:</label></td>
                <td><input type="number" id="stock" name="stock" min="0" required /></td>
            </tr>
        </table>
        <br>
        <button type="submit">Add Product</button>
    </form>



    <br>
    <!-- Navigation Buttons -->
    <div style="margin-top: 20px;">
        <a href="{% url 'eCommerce:vendor_store' store_id=store.id %}">
            <button>🏪 Back to Store</button>
        </a>

    </div>
</body>
</html>
