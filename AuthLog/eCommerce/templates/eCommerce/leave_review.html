{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Leave Review</title>
    <link rel="stylesheet" href="{% static 'eCommerce/styles.css' %}" />
</head>
<body>
    <h1>Leave Review</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

<table border="1" cellpadding="10" cellspacing="0">
    <form method="POST">
        {% csrf_token %}
        <tr>
            <td><label for="rating">Rating: ⭐</label></td>
            <td><input type="number" id="rating" name="rating" min="1" max="5" required /></td>
        </tr>
        <tr>
            <td><label for="comment">Comment:</label></td>
            <td><textarea id="comment" name="comment" required></textarea></td>
        </tr>
</table>
        <br>
        <button type="submit">Leave Review</button>
    </form>
    <br>
    <br>
    <!-- Navigation Buttons -->
    <div style="margin-top: 20px;">
        <a href="{% url 'eCommerce:products_list' %}">
            <button>🏪 Back to Catalog</button>
        </a>
    </div>

    <div style="margin-top: 20px;">
        <a href="{% url 'grabsomore:welcome' %}">
            <button>⬅️ Back Home</button>
        </a>
    </div>
</body>
</html>
