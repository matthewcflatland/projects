{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Stores</title>
    <link rel="stylesheet" href="{% static 'eCommerce/styles.css' %}" />
</head>
<body>
    <h1>Manage Stores</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %} 

    {% if stores %}
        <table border="1" cellpadding="10" cellspacing="0">
                {% for store in stores %}
                    <tr>
                        <td>{{ store.name }}</td>
                        <td>
                            <a href="{% url 'eCommerce:vendor_store' store_id=store.id %}">
                                <button>Edit Store</button>
                            </a>
                    </tr>
                {% endfor %}
        </table>
    {% else %}
        <p>No stores available.</p>
    {% endif %}

    <br>

    <!-- Navigation Buttons -->
    <div style="margin-top: 20px;">
        <a href="{% url 'eCommerce:add_store' %}">
            <button>➕ Add store</button>
        </a>
    </div>

    <div style="margin-top: 20px;">
        <a href="{% url 'grabsomore:welcome' %}">
            <button>⬅️ Back Home</button>
        </a>
    </div>
    
</body>
</html>
